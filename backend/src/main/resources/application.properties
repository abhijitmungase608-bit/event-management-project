server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/eventsphere_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:EventSphereSuperSecretJWTKeyWithAtLeast256BitsOfSecurityForSigningTokens123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# App & Admin Bootstrap Configuration
app.whatsapp.business-number=${WHATSAPP_BUSINESS_NUMBER:919876543210}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:admin@eventsphere.com}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@123456}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# SpringDoc / Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.eventsphere=INFO
