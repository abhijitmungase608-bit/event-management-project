version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: eventsphere-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eventsphere_db
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: eventsphere-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/eventsphere_db
      JWT_SECRET: EventSphereSuperSecretJWTKeyWithAtLeast256BitsOfSecurityForSigningTokens123456789
      FRONTEND_URL: http://localhost:5173
      WHATSAPP_BUSINESS_NUMBER: 919876543210
      ADMIN_BOOTSTRAP_EMAIL: admin@eventsphere.com
      ADMIN_BOOTSTRAP_PASSWORD: Admin@123456
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: eventsphere-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
